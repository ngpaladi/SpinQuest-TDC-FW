CONFIG_DP83867_PHY=y
CONFIG_UIO=y
CONFIG_UIO_PDRV_GENIRQ=y
CONFIG_UIO_DMEM_GENIRQ=y
# Link aggregation: the two GEMs bond into one logical link (802.3ad/LACP) so a
# smart switch can aggregate several boards into a single fast uplink.
# Built in rather than a module so bond0 can come up before userspace.
CONFIG_BONDING=y
